<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRXCARDING — Processing</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #0a0c14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }
    .processing-card {
      background: rgba(18, 22, 34, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 48px;
      padding: 50px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .processing-card .icon {
      font-size: 56px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.6; }
    }
    .processing-card h2 {
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .processing-card p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .processing-card .spinner {
      margin: 28px auto;
      width: 48px;
      height: 48px;
      border: 3px solid rgba(59,130,246,0.15);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .processing-card .note {
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="processing-card">
    <div class="icon">🔄</div>
    <h2>Verifying Your Card</h2>
    <p>Please wait while we securely process your details.</p>
    <div class="spinner"></div>
    <p style="font-size:13px;color:#64748b;">This may take a few seconds...</p>
    <div class="note">🔒 Encrypted connection • Simulated environment</div>
  </div>

  <script>
    // Auto-redirect to Page 4 after 3 seconds (simulated approval)
    setTimeout(function() {
      window.location.href = '/page4.html';
    }, 3000);
  </script>
</body>
</html>
