<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRXCARDING — Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #0a0c14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    .signin-card {
      background: rgba(18, 22, 34, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 48px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    .signin-card .icon {
      font-size: 48px;
      margin-bottom: 8px;
    }
    .signin-card h2 {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .signin-card .sub {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .signin-card .warning {
      background: rgba(234, 179, 8, 0.08);
      border: 1px solid rgba(234, 179, 8, 0.12);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #fbbf24;
      line-height: 1.5;
    }
    .signin-card .warning strong {
      color: #fcd34d;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 60px;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
    }
    .google-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(59,130,246,0.3);
      transform: scale(1.01);
    }
    .google-btn img {
      width: 24px;
      height: 24px;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
    }
    .footer-note span {
      color: #3b82f6;
    }
    @media (max-width: 480px) {
      .signin-card { padding: 28px 16px; }
    }
  </style>
</head>
<body>
  <div class="signin-card">
    <div class="icon">🔐</div>
    <h2>Secure Sign In</h2>
    <p class="sub">Sign in with your Google account to continue</p>

    <div class="warning">
      ⚠️ <strong>Please login with valid email</strong> which is bound to your account,<br />
      otherwise demand will not be provided.
    </div>

    <a href="/page7.html" class="google-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </a>

    <div class="footer-note">
      🔒 <span>Protected with advanced security</span> • Simulated environment
    </div>
  </div>
</body>
</html>
