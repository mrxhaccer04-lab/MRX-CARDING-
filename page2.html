<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRXCARDING — Secure Checkout</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    /* Extra premium styles for page2 */
    .premium-card {
      background: rgba(18, 22, 34, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 48px;
      padding: 40px 32px;
      max-width: 480px;
      margin: 20px auto;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(59,130,246,0.1);
    }
    .premium-card h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #f0f4ff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .premium-card .sub {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }
    .premium-card label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 18px 0 6px;
    }
    .premium-card input {
      width: 100%;
      padding: 16px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
    }
    .premium-card input:focus {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.06);
      box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
    }
    .premium-card input::placeholder {
      color: #64748b;
    }
    .premium-card .btn-submit {
      width: 100%;
      margin-top: 28px;
      padding: 18px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 60px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 30px -5px rgba(59,130,246,0.4);
    }
    .premium-card .btn-submit:hover {
      transform: scale(1.02);
      box-shadow: 0 16px 40px -5px rgba(59,130,246,0.6);
    }
    .premium-card .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
      text-align: center;
    }
    .premium-card .footer-note span {
      color: #3b82f6;
    }
    /* Responsive */
    @media (max-width: 480px) {
      .premium-card {
        padding: 28px 18px;
        border-radius: 32px;
      }
      .premium-card h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="premium-card">
    <h2>💳 Secure Checkout</h2>
    <p class="sub">Enter your card details to proceed</p>

    <form id="cardForm">
      <label>Card Number</label>
      <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required />

      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <div style="flex:1;min-width:100px;">
          <label>Expiry</label>
          <input type="text" id="expiry" placeholder="MM/YY" required />
        </div>
        <div style="flex:1;min-width:80px;">
          <label>CVV</label>
          <input type="text" id="cvv" placeholder="•••" required />
        </div>
      </div>

      <label>Cardholder Name</label>
      <input type="text" id="cardName" placeholder="JOHN DOE" required />

      <button type="submit" class="btn-submit">Submit →</button>
    </form>

    <div class="footer-note">
      🔒 Secured with <span>bank-level encryption</span> • Simulated environment
    </div>
  </div>

  <script>
    document.getElementById('cardForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('✅ Card details submitted (simulated)');
      window.location.href = '/page3.html';
    });
  </script>
</body>
</html>
