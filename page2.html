<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRXCARDING — Card Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" style="max-width:450px;">
    <h2>💳 Card Details</h2>
    <p style="color:#94a3b8;margin-bottom:20px;">Enter your card information</p>
    <form id="cardForm">
      <input type="text" id="cardNumber" placeholder="Card Number" required />
      <input type="text" id="expiry" placeholder="Expiry (MM/YY)" required />
      <input type="text" id="cvv" placeholder="CVV" required />
      <input type="text" id="cardName" placeholder="Cardholder Name" required />
      <button type="submit" class="btn-primary" style="width:100%;border:none;cursor:pointer;">Submit →</button>
    </form>
    <p style="margin-top:20px;font-size:12px;color:#64748b;">🔒 This is a simulated environment.</p>
  </div>
  <script>
    document.getElementById('cardForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Card details submitted (simulated)');
      window.location.href = '/page3.html';
    });
  </script>
</body>
</html>
