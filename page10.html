<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRXCARDING — Processing</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #0a0c14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    .processing-card {
      background: rgba(18, 22, 34, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 48px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    .processing-card .icon {
      font-size: 56px;
      margin-bottom: 12px;
      display: inline-block;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.6; }
    }
    .processing-card h2 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .processing-card .sub {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .processing-card .timer {
      font-size: 42px;
      font-weight: 700;
      color: #3b82f6;
      margin: 16px 0;
    }
    .processing-card .warning-box {
      background: rgba(234, 179, 8, 0.06);
      border: 1px solid rgba(234, 179, 8, 0.10);
      border-radius: 20px;
      padding: 16px 18px;
      margin: 16px 0 20px;
      text-align: left;
    }
    .processing-card .warning-box p {
      color: #fbbf24;
      font-size: 13px;
      margin: 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .processing-card .warning-box p span {
      font-size: 16px;
    }
    .processing-card .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #475569;
    }
    .processing-card .footer-note span {
      color: #3b82f6;
    }
    @media (max-width: 480px) {
      .processing-card { padding: 28px 16px; }
      .processing-card .timer { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="processing-card">
    <div class="icon">⏳</div>
    <h2>Processing Your Request</h2>
    <p class="sub">Please wait while we complete your transaction.</p>

    <div class="timer" id="timerDisplay">15:00</div>

    <div class="warning-box">
      <p><span>⚠️</span> Do not refresh this page</p>
      <p><span>⚠️</span> Do not close this page</p>
      <p><span>⚠️</span> Do not open Free Fire</p>
    </div>

    <div class="footer-note">
      🔒 <span>Secure</span> • Simulated environment
    </div>
  </div>

  <script>
    let totalSeconds = 15 * 60; // 15 minutes
    const timerDisplay = document.getElementById('timerDisplay');

    function updateTimer() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        timerDisplay.textContent = '✅ Done!';
        // Redirect to dashboard after 15 min
        setTimeout(function() {
          window.location.href = '/page4.html';
        }, 1500);
        return;
      }
      totalSeconds--;
    }

    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
